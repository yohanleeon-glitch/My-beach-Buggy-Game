<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Beach Buggy Realistic - Tamil</title>
    <style>
        body { margin: 0; background: #222; overflow: hidden; font-family: 'Arial', sans-serif; }
        canvas { display: block; margin: 0 auto; background: #e2b35a; } /* மணல் நிறம் */
        #ui { position: absolute; top: 10px; width: 100%; text-align: center; color: white; font-size: 24px; font-weight: bold; text-shadow: 2px 2px #000; pointer-events: none; }
        #controls { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: space-around; }
        .btn { width: 90px; height: 90px; background: rgba(255,255,255,0.2); border: 3px solid white; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 40px; user-select: none; -webkit-tap-highlight-color: transparent; }
        .btn:active { background: rgba(255,255,255,0.5); transform: scale(0.9); }
    </style>
</head>
<body>
    <div id="ui">Score: 0</div>
    <canvas id="gameCanvas"></canvas>
    <div id="controls">
        <div class="btn" id="leftBtn">◀</div>
        <div class="btn" id="rightBtn">▶</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('ui');

        canvas.width = Math.min(window.innerWidth, 450);
        canvas.height = window.innerHeight;

        let score = 0;
        let gameActive = true;
        let speed = 5;

        // கார் அமைப்பு
        const car = {
            x: canvas.width / 2 - 25,
            y: canvas.height - 150,
            w: 50,
            h: 90,
            targetX: canvas.width / 2 - 25
        };

        const enemies = [];
        const roadStrips = [];

        // சாலைக் கோடுகள் (Road markings)
        for (let i = 0; i < 5; i++) {
            roadStrips.push({ x: canvas.width / 2 - 5, y: i * (canvas.height / 4), w: 10, h: 50 });
        }

        function drawBuggy(x, y, color, isPlayer) {
            // கார் உடல்
            ctx.fillStyle = color;
            ctx.fillRect(x, y + 10, 50, 70);
            
            // டயர்கள் (Realistic Wheels)
            ctx.fillStyle = "#111";
            ctx.fillRect(x - 8, y + 15, 12, 20); // FL
            ctx.fillRect(x + 46, y + 15, 12, 20); // FR
            ctx.fillRect(x - 8, y + 55, 12, 20); // RL
            ctx.fillRect(x + 46, y + 55, 12, 20); // RR

            // கண்ணாடிகள்
            ctx.fillStyle = "#add8e6";
            ctx.fillRect(x + 5, y + 25, 40, 15);
            
            if(isPlayer) {
                // ஹெட்லைட்
                ctx.fillStyle = "yellow";
                ctx.fillRect(x + 5, y + 5, 10, 5);
                ctx.fillRect(x + 35, y + 5, 10, 5);
            }
        }

        function update() {
            if (!gameActive) return;

            // மணல் பின்னணி மற்றும் சாலை
            ctx.fillStyle = "#e2b35a"; // Sand
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = "#555"; // Road
            ctx.fillRect(40, 0, canvas.width - 80, canvas.height);

            // நகரும் சாலைக் கோடுகள்
            ctx.fillStyle = "white";
            roadStrips.forEach(strip => {
                strip.y += speed;
                if (strip.y > canvas.height) strip.y = -50;
                ctx.fillRect(strip.x, strip.y, strip.w, strip.h);
            });

            // பிளேயர் கார் மூவ்மென்ட் (Smooth transition)
            car.x += (car.targetX - car.x) * 0.2;
            drawBuggy(car.x, car.y, "red", true);

            // எதிரி கார்கள்
            if (Math.random() < 0.02) {
                const lane = Math.random() > 0.5 ? canvas.width/2 + 20 : canvas.width/2 - 70;
                enemies.push({ x: lane, y: -100, w: 50, h: 90 });
            }

            enemies.forEach((enemy, index) => {
                enemy.y += speed;
                drawBuggy(enemy.x, enemy.y, "blue", false);

                // விபத்து (Collision)
                if (car.x < enemy.x + enemy.w && car.x + 50 > enemy.x && car.y < enemy.y + enemy.h && car.y + 90 > enemy.y) {
                    gameActive = false;
                    alert("விபத்து! உங்கள் ஸ்கோர்: " + score);
                    location.reload();
                }

                // ஸ்கோர் மற்றும் வேகம் அதிகரிப்பு
                if (enemy.y > canvas.height) {
                    enemies.splice(index, 1);
                    score++;
                    scoreElement.innerText = "Score: " + score;
                    if(score % 5 === 0) speed += 0.5; // வேகம் கூடும்
                }
            });

            requestAnimationFrame(update);
        }

        // கட்டுப்பாடுகள்
        document.getElementById('leftBtn').ontouchstart = (e) => { e.preventDefault(); if (car.targetX > 60) car.targetX -= 100; };
        document.getElementById('rightBtn').ontouchstart = (e) => { e.preventDefault(); if (car.targetX < canvas.width - 110) car.targetX += 100; };

        update();
    </script>
</body>
</html>
