<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate 3D Beach Buggy Safari</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; }
        #ui { position: absolute; top: 20px; width: 100%; text-align: center; color: white; font-size: 28px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.7); z-index: 10; pointer-events: none; }
        #msg { position: absolute; top: 60px; width: 100%; text-align: center; color: yellow; font-size: 14px; z-index: 10; }
    </style>
</head>
<body>
    <div id="ui">Score: 0</div>
    <div id="msg">மொபைலைச் சாய்த்து (Tilt) காரைக் கட்டுப்படுத்துங்கள்!</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        let scene, camera, renderer, buggy, score = 0;
        let objects = [], tiltX = 0;
        let speed = 0.5;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 6, 15);
            camera.lookAt(0, 2, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // Sunlight ☀️
            const sun = new THREE.DirectionalLight(0xffffff, 1.5);
            sun.position.set(10, 20, 10);
            scene.add(sun);
            scene.add(new THREE.AmbientLight(0xffffff, 0.4));

            // Environment: Road, Sea, Sand
            createWorld();
            createBuggy();

            // Mobile Tilt Control 📱
            if (window.DeviceOrientationEvent) {
                window.addEventListener('deviceorientation', (event) => {
                    tiltX = event.gamma / 10; // Left/Right tilt
                });
            }

            animate();
        }

        function createWorld() {
            // Road 🛣️
            const road = new THREE.Mesh(new THREE.PlaneGeometry(10, 2000), new THREE.MeshPhongMaterial({ color: 0x333333 }));
            road.rotation.x = -Math.PI / 2;
            scene.add(road);

            // Sea 🌊 (Left)
            const sea = new THREE.Mesh(new THREE.PlaneGeometry(60, 2000), new THREE.MeshPhongMaterial({ color: 0x00aaff, transparent: true, opacity: 0.7 }));
            sea.rotation.x = -Math.PI / 2;
            sea.position.set(-35, -0.1, 0);
            scene.add(sea);

            // Sand 🏖️ (Right)
            const sand = new THREE.Mesh(new THREE.PlaneGeometry(60, 2000), new THREE.MeshPhongMaterial({ color: 0xffddaa }));
            sand.rotation.x = -Math.PI / 2;
            sand.position.set(35, -0.1, 0);
            scene.add(sand);
        }

        // Creatures & Nature: 🌴🦀🐬🐢
        function addCreature(type, x, z) {
            let mesh;
            if (type === 'palm') {
                const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.4, 5), new THREE.MeshPhongMaterial({ color: 0x8b4513 }));
                const leaves = new THREE.Mesh(new THREE.SphereGeometry(2, 8, 8), new THREE.MeshPhongMaterial({ color: 0x00ff00 }));
                leaves.position.y = 2.5;
                mesh = new THREE.Group(); mesh.add(trunk); mesh.add(leaves);
            } else if (type === 'crab') {
                mesh = new THREE.Mesh(new THREE.SphereGeometry(0.4, 8, 8), new THREE.MeshPhongMaterial({ color: 0xff0000 }));
            } else if (type === 'whale') {
                mesh = new THREE.Mesh(new THREE.CapsuleGeometry(1, 4, 4, 8), new THREE.MeshPhongMaterial({ color: 0x444444 }));
                mesh.rotation.x = Math.PI/2;
            }

            mesh.position.set(x, 0.5, z);
            scene.add(mesh);
            objects.push({ mesh, type });
        }

        function createBuggy() {
            buggy = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.8, 2.5), new THREE.MeshPhongMaterial({ color: 0xff0000 }));
            body.position.y = 0.6;
            buggy.add(body);
            // Wheels
            const wGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.4, 16);
            const wMat = new THREE.MeshPhongMaterial({ color: 0x000000 });
            [[0.8,0.5,1], [-0.8,0.5,1], [0.8,0.5,-1], [-0.8,0.5,-1]].forEach(p => {
                const w = new THREE.Mesh(wGeo, wMat); w.rotation.z = Math.PI/2;
                w.position.set(p[0], p[1], p[2]); buggy.add(w);
            });
            scene.add(buggy);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Car Tilt Movement
            buggy.position.x += tiltX * 0.5;
            buggy.position.x = Math.max(-4, Math.min(4, buggy.position.x)); // Limit to road
            buggy.rotation.z = -tiltX * 0.1; // Lean into turn

            // Spawn Creatures
            if (Math.random() < 0.05) addCreature('palm', 7, -100); // Right side trees
            if (Math.random() < 0.02) addCreature('crab', 5 + Math.random()*10, -100); // Sand crabs
            if (Math.random() < 0.01) addCreature('whale', -20, -150); // Sea whales

            objects.forEach((obj, i) => {
                obj.mesh.position.z += speed;
                
                // Interaction
                if (obj.type !== 'palm' && obj.type !== 'whale' && buggy.position.distanceTo(obj.mesh.position) < 2) {
                    alert("Game Over! Score: " + score);
                    location.reload();
                }

                if (obj.mesh.position.z > 20) {
                    scene.remove(obj.mesh);
                    objects.splice(i, 1);
                    if(obj.type === 'palm') { score++; document.getElementById('ui').innerText = "Score: " + score; }
                }
            });

            renderer.render(scene, camera);
        }

        init();
    </script>
</body>
</html><!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamil Game Dev</title>
    <style>
        body { margin: 0; text-align: center; font-family: sans-serif; background: #f0f0f0; overflow: hidden; }
        canvas { background: #fff; border-bottom: 5px solid #333; display: block; margin: 0 auto; }
        .info { padding: 10px; font-size: 20px; }
    </style>
</head>
<body>

    <div class="info">Score: <span id="score">0</span></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const scoreElement = document.getElementById("score");

        canvas.width = window.innerWidth;
        canvas.height = 400;

        let score = 0;
        let player = { x: 50, y: 350, w: 40, h: 40, dy: 0, jumpPower: -12, gravity: 0.6, grounded: true };
        let obstacles = [];
        let gameSpeed = 5;

        // Jump control
        window.addEventListener("touchstart", () => { if(player.grounded) { player.dy = player.jumpPower; player.grounded = false; } });
        window.addEventListener("keydown", (e) => { if(e.code === "Space" && player.grounded) { player.dy = player.jumpPower; player.grounded = false; } });

        function spawnObstacle() {
            let size = Math.random() * 30 + 20;
            obstacles.push({ x: canvas.width, y: 390 - size, w: 20, h: size });
        }

        let frame = 0;
        function update() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Player Physics
            player.dy += player.gravity;
            player.y += player.dy;
            if (player.y > 350) { player.y = 350; player.dy = 0; player.grounded = true; }

            // Draw Player
            ctx.fillStyle = "#FF5733";
            ctx.fillRect(player.x, player.y, player.w, player.h);

            // Obstacles
            if (frame % 100 === 0) spawnObstacle();
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let o = obstacles[i];
                o.x -= gameSpeed;
                ctx.fillStyle = "#333";
                ctx.fillRect(o.x, o.y, o.w, o.h);

                // Collision Detection
                if (player.x < o.x + o.w && player.x + player.w > o.x && player.y < o.y + o.h && player.y + player.h > o.y) {
                    alert("Game Over! Score: " + score);
                    score = 0;
                    obstacles = [];
                    gameSpeed = 5;
                }

                if (o.x + o.w < 0) {
                    obstacles.splice(i, 1);
                    score++;
                    gameSpeed += 0.1;
                }
            }

            scoreElement.innerText = score;
            frame++;
            requestAnimationFrame(update);
        }

        update();
    </script>
</body>
</html>
